<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/konva@10/konva.min.js"></script>
  <meta charset="utf-8">
  <title>Konva CSS Filters Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F0F0F0;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script>
    var width = window.innerWidth;
    var height = window.innerHeight;

    var stage = new Konva.Stage({
      container: 'container',
      width: width,
      height: height
    });

    var layer = new Konva.Layer();
    stage.add(layer);

    var imageObj = new Image();
    imageObj.onload = function () {
      // 左边：原图
      var original = new Konva.Image({
        x: 20,
        y: 20,
        image: imageObj,
        width: 180,
        height: 180
      });
      layer.add(original);

      // 右边：CSS 原生滤镜。注意这里没有调用 cache()——
      // CSS 滤镜由浏览器实现，不需要先把节点缓存成位图。
      var filtered = new Konva.Image({
        x: 230,
        y: 20,
        image: imageObj,
        width: 180,
        height: 180,
        filters: ['blur(6px)', 'saturate(1.8)']
      });
      layer.add(filtered);

      var label = new Konva.Text({
        x: 20,
        y: 210,
        text: '左：原图    右：blur(6px) + saturate(1.8)',
        fontSize: 14,
        fill: '#333'
      });
      layer.add(label);
    };
    imageObj.src = '/assets/yoda.jpg';
  </script>

</body>
</html>
