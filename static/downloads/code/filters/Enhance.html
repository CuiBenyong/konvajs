<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/konva@10/konva.min.js"></script>
  <meta charset="utf-8">
  <title>Konva Enhance Filter Demo</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #F0F0F0;
           font: 13px/1.7 system-ui, -apple-system, sans-serif; }
    #controls { padding: 6px 12px; }
    output { font-variant-numeric: tabular-nums; color: #555; }
    #note { padding: 0 12px 6px; color: #777; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="controls">
    <label>enhance
      <input type="range" id="e" min="0" max="1" step="0.05" value="1">
      <output id="eout">1</output>
    </label>
  </div>
  <div id="note">Enhance 把每个通道拉伸到满量程。原图若已占满 0–255 则毫无效果，
    所以这里特意用一张褪色的低对比度图。</div>
  <script>
    var stage = new Konva.Stage({ container: 'container', width: 320, height: 190 });
    var layer = new Konva.Layer();
    stage.add(layer);

    var imageObj = new Image();
    imageObj.onload = function () {
      // 造一张低对比度的源图：把原图以低不透明度叠在中灰底上，
      // 通道范围被压到大约 94–176，Enhance 才有东西可拉伸
      var off = document.createElement('canvas');
      off.width = imageObj.width;
      off.height = imageObj.height;
      var oc = off.getContext('2d');
      oc.fillStyle = '#8a8a8a';
      oc.fillRect(0, 0, off.width, off.height);
      oc.globalAlpha = 0.32;
      oc.drawImage(imageObj, 0, 0);
      oc.globalAlpha = 1;

      layer.add(new Konva.Text({ x: 10, y: 2, text: '原图（低对比度）', fontSize: 12, fill: '#333' }));
      layer.add(new Konva.Text({ x: 170, y: 2, text: 'Enhance 之后', fontSize: 12, fill: '#333' }));

      var before = new Konva.Image({ image: off, x: 10, y: 20, scaleX: 0.6, scaleY: 0.6 });
      var after = new Konva.Image({ image: off, x: 170, y: 20, scaleX: 0.6, scaleY: 0.6 });
      layer.add(before);
      layer.add(after);

      after.cache();
      after.filters([Konva.Filters.Enhance]);
      after.enhance(1);
      layer.draw();

      var e = document.getElementById('e');
      e.addEventListener('input', function () {
        after.enhance(parseFloat(e.value));
        document.getElementById('eout').textContent = e.value;
        layer.draw();
      });
    };
    imageObj.src = '/assets/lion.png';
  </script>
</body>
</html>
