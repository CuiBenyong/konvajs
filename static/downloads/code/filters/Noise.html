<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/konva@10/konva.min.js"></script>
  <meta charset="utf-8">
  <title>Konva Noise Filter Demo</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #F0F0F0;
           font: 13px/1.7 system-ui, -apple-system, sans-serif; }
    #controls { padding: 6px 12px; }
    #controls label { display: inline-block; margin-right: 14px; }
    output { font-variant-numeric: tabular-nums; color: #555; }
    #note { padding: 0 12px 6px; color: #777; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="controls"><label>noise <input type="range" id="n" min="0" max="1" step="0.02" value="0.4"><output id="no">0.4</output></label></div>
  
  <script>
    var stage = new Konva.Stage({ container: 'container', width: 300, height: 200 });
    var layer = new Konva.Layer();
    stage.add(layer);
    Konva.Image.fromURL('/assets/lion.png', function (img) {
      img.setAttrs({ x: 40, y: 10, draggable: true });
      layer.add(img);
      img.cache();
      img.filters([Konva.Filters.Noise]);
      img.noise(0.4);
      layer.draw();
      var n=document.getElementById('n');
      n.addEventListener('input',function(){
        img.noise(parseFloat(n.value));
        document.getElementById('no').textContent=n.value;
        layer.draw();
      });
    });
  </script>
</body>
</html>
