<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/konva@10/konva.min.js"></script>
  <meta charset="utf-8">
  <title>Konva Sepia Filter Demo</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #F0F0F0;
           font: 13px/1.7 system-ui, -apple-system, sans-serif; }
    #controls { padding: 6px 12px; }
    #controls label { display: inline-block; margin-right: 14px; }
    output { font-variant-numeric: tabular-nums; color: #555; }
    #note { padding: 0 12px 6px; color: #777; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="controls"></div>
  <div id="note">Sepia 用固定矩阵，没有任何配置项，强度不可调。</div>
  <script>
    var stage = new Konva.Stage({ container: 'container', width: 320, height: 190 });
    var layer = new Konva.Layer();
    stage.add(layer);
    Konva.Image.fromURL('/assets/lion.png', function (before) {
      before.setAttrs({ x: 10, y: 20, scaleX: 0.6, scaleY: 0.6 });
      var after = before.clone({ x: 170 });
      layer.add(new Konva.Text({ x: 10, y: 2, text: '原图', fontSize: 12, fill: '#333' }));
      layer.add(new Konva.Text({ x: 170, y: 2, text: 'Sepia', fontSize: 12, fill: '#333' }));
      layer.add(before);
      layer.add(after);
      after.cache();
      after.filters([Konva.Filters.Sepia]);
      layer.draw();
    });
  </script>
</body>
</html>
