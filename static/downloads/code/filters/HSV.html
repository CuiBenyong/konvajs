<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/konva@10/konva.min.js"></script>
  <meta charset="utf-8">
  <title>Konva HSV Filter Demo</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #F0F0F0;
           font: 13px/1.7 system-ui, -apple-system, sans-serif; }
    #controls { padding: 6px 12px; }
    #controls label { display: inline-block; margin-right: 14px; }
    output { font-variant-numeric: tabular-nums; color: #555; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="controls"><label>hue（0 ~ 360） <input type="range" id="h" min="0" max="360" step="1" value="200"><output id="hout">200</output></label><label>saturation（−2 ~ 10） <input type="range" id="s" min="-2" max="10" step="0.1" value="1.5"><output id="sout">1.5</output></label><label>value（−2 ~ 10） <input type="range" id="v" min="-2" max="10" step="0.1" value="0"><output id="vout">0</output></label></div>
  <script>
    var stage = new Konva.Stage({ container: 'container', width: 300, height: 200 });
    var layer = new Konva.Layer();
    stage.add(layer);

    Konva.Image.fromURL('/assets/lion.png', function (img) {
      img.setAttrs({ x: 40, y: 10, draggable: true });
      layer.add(img);
      // 滤镜只作用于缓存画布，没有 cache() 完全不生效
      img.cache();
      img.filters([Konva.Filters.HSV]);
      img.hue(200);
      img.saturation(1.5);
      img.value(0);
      layer.draw();
      var h = document.getElementById('h');
      h.addEventListener('input', function () {
        img.hue(parseFloat(h.value));
        document.getElementById('hout').textContent = h.value;
        layer.draw();
      });
      var s = document.getElementById('s');
      s.addEventListener('input', function () {
        img.saturation(parseFloat(s.value));
        document.getElementById('sout').textContent = s.value;
        layer.draw();
      });
      var v = document.getElementById('v');
      v.addEventListener('input', function () {
        img.value(parseFloat(v.value));
        document.getElementById('vout').textContent = v.value;
        layer.draw();
      });
    });
  </script>
</body>
</html>
